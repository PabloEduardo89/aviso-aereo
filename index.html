    el.onclick = () => { currentCode = a.code; currentView = 'list'; render(); };
    chips.appendChild(el);
  });
}

/* ---------- SVGs de exemplo (placeholders ilustrativos) ---------- */

// rumo magnético aproximado de uma cabeceira a partir do seu número (ex.: "14" -> 140°,
// "09R" -> 090°) — não é a orientação geográfica exata (isso exigiria coordenadas reais,
// que a AISWEB não devolve pra pista), mas já desenha cada pista na direção certa
// em vez do "14/32" fixo que era usado antes pra qualquer aeroporto
function runwayHeadingDeg(identEnd){
  const m = (identEnd || '').match(/^(\d{2})/);
  return m ? parseInt(m[1], 10) * 10 : 90;
}

// desenha o diagrama de pistas de um aeródromo de verdade: uma barra por pista,
// rotacionada conforme o rumo, com a(s) cabeceira(s) rotuladas nas pontas — e destaca
// em vermelho a pista citada no NOTAM (via "affected"), quando houver uma
function svgRunwayChart(affected, runwayIdents){
  const idents = (runwayIdents && runwayIdents.length) ? runwayIdents : ['09/27'];
  const affectedIdent = affected ? affected.replace(/^rwy/i, '').toUpperCase() : null;
  const cx = 160, cy = 110, barLen = 170, barW = 13;
  const n = idents.length;

  const bars = idents.map((identPair, i) => {
    const [endA, endB] = identPair.split('/');
    const heading = runwayHeadingDeg(endA);
    const rotation = heading - 90;
    const rad = (heading * Math.PI) / 180;
    // pistas paralelas (mesmo rumo) ficam sobrepostas se não deslocarmos uma das barras
    // perpendicularmente ao rumo; pistas que se cruzam (rumos diferentes) não precisam disso
    const offset = n > 1 ? (i - (n-1)/2) * 32 : 0;
    const bcx = cx + Math.cos(rad)*offset, bcy = cy + Math.sin(rad)*offset;
    const halfLen = barLen/2 + 14;
    const ex1 = bcx - Math.sin(rad)*halfLen, ey1 = bcy + Math.cos(rad)*halfLen;
    const ex2 = bcx + Math.sin(rad)*halfLen, ey2 = bcy - Math.cos(rad)*halfLen;
    const isHighlighted = affectedIdent && (endA.toUpperCase() === affectedIdent || endB.toUpperCase() === affectedIdent || identPair.toUpperCase() === affectedIdent);

    return `
      <rect x="${bcx-barLen/2}" y="${bcy-barW/2}" width="${barLen}" height="${barW}" rx="2"
        fill="${isHighlighted ? '#3A2A22' : '#2B3A56'}"
        stroke="${isHighlighted ? '#F2665A' : 'none'}" stroke-width="${isHighlighted ? 2.5 : 0}"
        ${isHighlighted ? 'stroke-dasharray="5 3"' : ''}
        transform="rotate(${rotation} ${bcx} ${bcy})"/>
      <text x="${ex1}" y="${ey1}" fill="#7C8AA5" font-size="9" font-family="monospace" text-anchor="middle">${endA}</text>
      <text x="${ex2}" y="${ey2}" fill="#7C8AA5" font-size="9" font-family="monospace" text-anchor="middle">${endB}</text>`;
  }).join('');

  // categorias que não são pista (pátio, espaço aéreo, navegação) não têm coordenada real
  // disponível — mostra um selo textual simples em vez de fingir uma posição exata
  const nonRunwayLabel = { apron: 'PÁTIO', airspace: 'ESPAÇO AÉREO', nav: 'AUXÍLIO À NAVEGAÇÃO', twy: 'PISTA DE TÁXI' }[affected];
  const nonRunwayTag = nonRunwayLabel ? `<rect x="10" y="10" width="${18+nonRunwayLabel.length*5.6}" height="18" rx="9" fill="rgba(242,102,90,0.15)" stroke="#F2665A"/><text x="19" y="23" fill="#F2665A" font-size="9.5" font-family="monospace">${nonRunwayLabel}</text>` : '';

  return `
  <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="220" fill="#0B111E"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#263352"/>
    ${bars}
    ${nonRunwayTag}
  </svg>`;
}

function svgSatellite(level){
  const cloudColor = level === 'med' ? '#F2A93B' : '#5FA8E8';
  return `
  <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g1" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#152036"/>
        <stop offset="100%" stop-color="#0B111E"/>
      </radialGradient>
    </defs>
    <rect width="320" height="200" fill="url(#g1)"/>
    <circle cx="160" cy="100" r="70" fill="none" stroke="#263352" stroke-width="1"/>
    <circle cx="160" cy="100" r="45" fill="none" stroke="#263352" stroke-width="1"/>
    <circle cx="160" cy="100" r="3" fill="${cloudColor}"/>
    <ellipse cx="120" cy="70" rx="38" ry="16" fill="${cloudColor}" opacity="0.25"/>
    <ellipse cx="190" cy="110" rx="50" ry="20" fill="${cloudColor}" opacity="0.35"/>
    <ellipse cx="150" cy="130" rx="30" ry="12" fill="${cloudColor}" opacity="0.2"/>
    <text x="12" y="18" fill="#7C8AA5" font-size="9" font-family="monospace">SATÉLITE · CANAL IV</text>
  </svg>`;
}

/* ---------- render principal ---------- */

function render(){
  renderChips();
  const airport = AIRPORTS.find(a => a.code === currentCode);
  const main = document.getElementById('main');

  if(currentTab !== 'mapa' && mapInstance){
    teardownMap();
  }

  if(currentTab === 'mapa'){
    renderMapaTab(main);
    return;
  }

  if(currentTab === 'metar'){
    if(metarMode === 'live'){
      if(REAL_METAR[currentCode] === undefined) loadRealMetar(currentCode);
      if(metarSubTab === 'imagem' && REAL_SATELITE === undefined) loadRealSatelite();
    } else if(metarMode === 'historic' && historicDate){
      const mKey = `${currentCode}_${historicDate}`;
      if(HISTORIC_METAR[mKey] === undefined) loadHistoricMetar(currentCode, historicDate);
      if(metarSubTab === 'imagem' && historicHour !== null){
        const sKey = `${historicDate}_${pad(historicHour)}`;
        if(HISTORIC_SATELLITE[sKey] === undefined) loadHistoricSatelite(historicDate, historicHour);
      }
    }
  }
  if(currentTab === 'notam' && REAL_NOTAM[currentCode] === undefined) loadRealNotam(currentCode);
  // ROTAER também é buscada na aba NOTAM (não só na aba ROTAER): o diagrama de pista
  // do detalhe do NOTAM precisa saber a configuração real de pistas do aeródromo
  if((currentTab === 'rotaer' || currentTab === 'notam') && REAL_ROTAER[currentCode] === undefined) loadRealRotaer(currentCode);
  if((currentTab === 'rotaer' || currentTab === 'notam') && REAL_CARTA_ADC[currentCode] === undefined) loadRealCartaAdc(currentCode);

  if(currentView === 'notam-detail'){
    renderNotamDetail(main, airport);
    return;
  }

  // view padrão: lista
  let updated = "—";
  if(currentTab === "notam"){
    const nd = getNotamData(currentCode);
    updated = nd.updated || (nd.source === 'unavailable' ? '—' : 'carregando...');
  }
  if(currentTab === "metar") updated = (getMetarData(currentCode) || {}).updated || "—";
  if(currentTab === "rotaer"){
    const rd = getRotaerData(currentCode);
    updated = rd.source === 'real' ? 'dado oficial — AISWEB' : rd.source === 'fallback' ? 'ficha de exemplo' : rd.source === 'unavailable' ? '—' : 'carregando...';
  }

  main.innerHTML = `
    <div class="airport-banner">
      <div>
        <div class="code">${airport.code} · ${airport.uf}</div>
        <div class="city">${airport.city}</div>
      </div>
      <div class="updated">Atualizado<b>${updated}</b></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="sections"></div>
  `;
  renderTabs();

  if(currentTab === "notam") renderNotamList(getNotamData(currentCode));
  if(currentTab === "metar") renderMetarSection(airport);
  if(currentTab === "rotaer") renderRotaer(getRotaerData(currentCode));
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = "";
  TABS.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === currentTab ? ' active' : '');
    el.textContent = t.label;
    el.onclick = () => { currentTab = t.id; render(); };
    tabs.appendChild(el);
  });
}

function renderNotamList(data){
  const sections = document.getElementById('sections');
  if(!data || data.source === 'loading'){
    currentNotamList = [];
    sections.innerHTML = `<div class="empty"><div class="icon">—</div>Carregando NOTAM da AISWEB...</div>`;
    return;
  }
  if(data.source === 'unavailable'){
    currentNotamList = [];
    sections.innerHTML = `<div class="empty"><div class="icon">—</div>Não foi possível carregar NOTAM da AISWEB para este aeroporto no momento.</div>`;
    return;
  }
  currentNotamList = data.notices;
  const sourceHtml = sourceTagHtml(data.source, 'AISWEB');
  if(data.notices.length === 0){
    sections.innerHTML = sourceHtml + `<div class="empty"><div class="icon">✓</div>Nenhum aviso relevante no momento para este aeroporto.</div>`;
    return;
  }
  sections.innerHTML = sourceHtml + `<div class="section-label">Avisos ativos · ${data.notices.length}</div>` +
    data.notices.map((n, i) => `
      <div class="card ${n.level}">
        <div class="card-top">
          <div class="card-title">${n.title}</div>
          <div class="badge ${n.level}">${levelLabel(n.level)}</div>
        </div>
        <div style="margin-top:8px; font-size:13.5px; color:var(--text); opacity:0.9; line-height:1.5;">
          ${n.plain}
        </div>
        <div class="card-meta">
          <span>${n.category}</span>
          <span>Válido: ${n.validity}</span>
        </div>
        <div class="link-row">
          <div class="toggle-raw" onclick="toggleRaw(${i})" id="toggle-${i}">Texto original</div>
          <div class="link-detail" onclick="openNotamDetail(${i})">Ver carta e detalhes</div>
        </div>
        <div class="raw-box" id="raw-${i}">${n.raw}</div>
      </div>
    `).join('');
}

function renderMetarSection(airport){
  const sections = document.getElementById('sections');
  sections.innerHTML = `
    <div class="date-nav" id="dateNav"></div>
    <div class="subtabs" id="metarSubtabs"></div>
    <div id="metarSubContent"></div>
  `;
  renderDateNav();
  renderMetarSubtabs();

  const data = getMetarData(currentCode);
  if(metarSubTab === 'imagem') renderMetarImagem(data);
  else renderMetarResumo(data, airport);
}

function renderDateNav(){
  const wrap = document.getElementById('dateNav');
  const today = todayLocalDateStr();
  wrap.innerHTML = `
    <div class="date-toggle">
      <div class="date-opt ${metarMode === 'live' ? 'active' : ''}" id="modeLive">Agora</div>
      <div class="date-opt ${metarMode === 'historic' ? 'active' : ''}" id="modeHistoric">Escolher data</div>
    </div>
    ${metarMode === 'historic' ? `
      <div class="date-picker">
        <input type="date" id="historicDateInput" class="date-input" max="${today}" value="${historicDate || today}">
        <div class="hour-hint">Data e horário em Brasília (UTC-3)</div>
        <div class="hour-scroll" id="hourScroll"></div>
      </div>
    ` : ''}
  `;
  document.getElementById('modeLive').onclick = () => { metarMode = 'live'; render(); };
  document.getElementById('modeHistoric').onclick = () => {
    metarMode = 'historic';
    if(!historicDate) historicDate = today;
    render();
  };
  if(metarMode === 'historic'){
    document.getElementById('historicDateInput').onchange = (e) => {
      historicDate = e.target.value;
      historicHour = null;
      render();
    };
    renderHourScroll();
  }
}

function renderHourScroll(){
  const wrap = document.getElementById('hourScroll');
  if(!wrap) return;
  const key = `${currentCode}_${historicDate}`;
  const list = HISTORIC_METAR[key];
  if(list === undefined){
    wrap.innerHTML = `<div class="hour-hint">Carregando horários disponíveis...</div>`;
    return;
  }
  if(list === null || list.length === 0){
    wrap.innerHTML = `<div class="hour-hint">Nenhum registro METAR encontrado nesta data.</div>`;
    return;
  }
  wrap.innerHTML = list.map(r => `
    <div class="hour-chip ${r.hour === historicHour ? 'active' : ''}" data-hour="${r.hour}">${pad(r.hour)}h</div>
  `).join('');
  wrap.querySelectorAll('.hour-chip').forEach(el => {
    el.onclick = () => { historicHour = parseInt(el.dataset.hour, 10); render(); };
  });
}

function renderMetarSubtabs(){
  const wrap = document.getElementById('metarSubtabs');
  const subs = [
    { id: 'resumo', label: 'Resumo' },
    { id: 'imagem', label: 'Imagem de satélite' },
  ];
  wrap.innerHTML = '';
  subs.forEach(s => {
    const el = document.createElement('div');
    el.className = 'subtab' + (s.id === metarSubTab ? ' active' : '');
    el.textContent = s.label;
    el.onclick = () => { metarSubTab = s.id; render(); };
    wrap.appendChild(el);
  });
}

function renderMetarResumo(data, airport){
  const content = document.getElementById('metarSubContent');
  if(!data || ['loading','empty','idle'].includes(data.source)){
    const msg = data && data.source === 'loading' ? 'Carregando METAR...'
      : data && data.source === 'empty' ? 'Nenhum registro METAR encontrado para esta data.'
      : data && data.source === 'idle' ? 'Escolha uma data acima para consultar o METAR histórico.'
      : 'Sem dados meteorológicos no momento.';
    content.innerHTML = `<div class="empty"><div class="icon">—</div>${msg}</div>`;
    return;
  }
  const label = data.source === 'historic' ? `Condições em ${data.updated}` : `Condições atuais · atualizado ${data.updated}`;
  const summaryText = buildMetarPlainSummary(data, airport);
  content.innerHTML = `
    <div class="section-label">${label}</div>
    ${sourceTagHtml(data.source)}
    <div class="card ${data.level}" style="margin-bottom:14px;">
      <div class="card-top">
        <div class="card-title">${data.condition}</div>
        <div class="badge ${data.level}">${levelLabel(data.level)}</div>
      </div>
    </div>
    <div class="btn-summary" onclick="toggleMetarSummary()">
      <span class="ic">✨</span><span id="btnSummaryLabel">${metarSummaryOpen ? 'Ocultar resumo' : 'Gerar resumo em linguagem simples'}</span>
    </div>
    <div class="plain-block summary${metarSummaryOpen ? ' show' : ''}" id="metarSummaryBlock">${summaryText}</div>
    <div class="metar-grid">
      <div class="metar-stat"><div class="label">Vento</div><div class="value">${data.wind} <span>${data.windSpeed}</span></div></div>
      <div class="metar-stat"><div class="label">Visibilidade</div><div class="value">${data.visibility}</div></div>
      <div class="metar-stat"><div class="label">Nuvens</div><div class="value" style="font-size:14px;">${data.clouds}</div></div>
      <div class="metar-stat"><div class="label">Temperatura</div><div class="value">${data.temp} <span>orvalho ${data.dew}</span></div></div>
      <div class="metar-stat" style="grid-column: span 2;"><div class="label">Pressão (QNH)</div><div class="value">${data.qnh}</div></div>
    </div>
    <div class="link-row">
      <div class="toggle-raw" onclick="toggleRaw('metar')" id="toggle-metar">Texto original</div>
    </div>
    <div class="raw-box" id="raw-metar">${data.raw}</div>
  `;
}

function toggleMetarSummary(){
  metarSummaryOpen = !metarSummaryOpen;
  render();
}

function renderMetarImagem(metarData){
  const content = document.getElementById('metarSubContent');
  const sat = getSateliteData();
  const level = (metarData && metarData.level) ? metarData.level : 'low';
  const hasImage = sat.source === 'real' || sat.source === 'historic';

  const frame = hasImage
    ? `<img src="${sat.path}" alt="Imagem de satélite REDEMET" style="width:100%; height:auto; display:block; border-radius:8px;">`
    : svgSatellite(level);

  let caption;
  if(sat.source === 'real') caption = `Imagem de satélite real (infravermelho realçado), fornecida pela API-REDEMET/DECEA · atualizada ${sat.updated}.`;
  else if(sat.source === 'historic') caption = `Imagem de satélite real (infravermelho realçado) de <b>${sat.updated}</b>, fornecida pela API-REDEMET/DECEA.`;
  else if(sat.source === 'loading') caption = 'Carregando imagem de satélite da REDEMET...';
  else if(sat.source === 'idle') caption = 'Escolha uma data e um horário acima para ver a imagem de satélite daquele momento.';
  else if(sat.source === 'fallback-historic') caption = 'Ilustração de exemplo — não há imagem de satélite registrada para esse horário exato.';
  else caption = 'Ilustração de exemplo — não foi possível carregar a imagem real da REDEMET no momento.';

  const tagSource = sat.source === 'idle' ? '' : (sat.source === 'fallback-historic' ? 'fallback' : sat.source);
  const hasMetarFields = metarData && metarData.raw;

  content.innerHTML = `
    <div class="section-label">Imagem de satélite · Brasil</div>
    ${sourceTagHtml(tagSource)}
    <div class="image-frame">${frame}</div>
    <div class="image-caption">${caption}</div>
    ${hasMetarFields ? `
      <div class="section-label">Leitura campo a campo</div>
      <div class="tech-table">
        ${[
          { code: metarData.raw.split(' ')[2] || '', t: 'Data e hora', d: 'Dia e horário (UTC) da observação' },
          { code: metarData.wind + ' / ' + metarData.windSpeed, t: 'Vento', d: 'Direção de onde o vento sopra e sua intensidade' },
          { code: metarData.visibility, t: 'Visibilidade horizontal', d: 'Distância máxima enxergada na horizontal' },
          { code: metarData.clouds, t: 'Nebulosidade', d: 'Quantidade e altura da base das nuvens' },
          { code: metarData.temp + ' / ' + metarData.dew, t: 'Temperatura / ponto de orvalho', d: 'Quanto mais próximos, maior a chance de neblina' },
          { code: metarData.qnh, t: 'Pressão QNH', d: 'Usada pelos pilotos para calibrar o altímetro' },
        ].map(r => `
          <div class="tech-row">
            <div class="tech-code">${r.code}</div>
            <div class="tech-mean"><div class="t">${r.t}</div><div class="d">${r.d}</div></div>
          </div>
        `).join('')}
      </div>
      <div class="section-label">Texto original (METAR)</div>
      <div class="raw-box show" style="margin-bottom:16px;">${metarData.raw}</div>
    ` : ''}
  `;
}

function renderRotaer(data){
  const sections = document.getElementById('sections');
  if(!data || data.source === 'loading'){
    sections.innerHTML = `<div class="empty"><div class="icon">—</div>Carregando ficha ROTAER da AISWEB...</div>`;
    return;
  }
  if(data.source === 'unavailable'){
    sections.innerHTML = `<div class="empty"><div class="icon">—</div>Sem ficha ROTAER disponível para este aeroporto.</div>`;
    return;
  }
  const rows = [
    ["Nome oficial", data.nome], ["Elevação", data.elevacao], ["Pista", data.pista],
    ["Horário de funcionamento", data.horario], ["Frequência Torre", data.freqTorre],
    ["Frequência Aproximação", data.freqAproximacao], ["Combustível disponível", data.combustivel],
  ];
  const cartaUrl = getCartaAdcUrl(currentCode);
  sections.innerHTML = `
    <div class="section-label">Ficha do aeródromo</div>
    ${sourceTagHtml(data.source, 'AISWEB')}
    <div class="rotaer-card">
      ${rows.map(([k,v]) => `<div class="rotaer-row"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
    </div>
    ${cartaUrl ? `
    <div class="link-row">
      <a href="${cartaUrl}" target="_blank" rel="noopener" class="link-detail" style="text-decoration:none;">Ver Carta de Aeródromo oficial (PDF, técnico)</a>
    </div>` : ''}
  `;
}

/* ---------- sub-páginas de detalhe (camada 2) ---------- */

function openNotamDetail(i){
  currentNotamIndex = i;
  currentView = 'notam-detail';
  notamSummaryOpen = false;
  render();
}
function backToList(){
  currentView = 'list';
  render();
}

function renderNotamDetail(main, airport){
  const n = currentNotamList[currentNotamIndex];
  const rotaerData = getRotaerData(currentCode);
  const runwaysList = rotaerData && rotaerData.runwaysList;
  const geoLink = n.geoUrl
    ? ` <a href="${n.geoUrl}" target="_blank" rel="noopener" style="color:var(--blue);">Ver localização exata no mapa oficial (DECEA)</a>.`
    : '';
  const cartaUrl = getCartaAdcUrl(currentCode);
  const cartaLink = cartaUrl
    ? ` <a href="${cartaUrl}" target="_blank" rel="noopener" style="color:var(--blue);">Ver Carta de Aeródromo oficial (PDF, técnico)</a>.`
    : '';
  main.innerHTML = `
    <div class="back-btn" onclick="backToList()">voltar</div>
    <div class="detail-header">
      <div class="d-title">${n.title}</div>
      <div class="d-meta">
        <span>${airport.code} · ${n.category}</span>
        <span>Válido: ${n.validity}</span>
      </div>
    </div>

    <div class="btn-summary" onclick="toggleNotamSummary()">
      <span class="ic">✨</span><span id="btnNotamSummaryLabel">${notamSummaryOpen ? 'Ocultar resumo' : 'Gerar resumo em linguagem simples'}</span>
    </div>
    <div class="plain-block summary${notamSummaryOpen ? ' show' : ''}" id="notamSummaryBlock">${buildNotamPlainSummary(n, airport)}</div>

    <div class="section-label">Carta do aeródromo</div>
    <div class="image-frame">${svgRunwayChart(n.affected, runwaysList)}</div>
    <div class="image-caption">Diagrama esquemático com a(s) pista(s) real(is) do aeródromo${n.affected && n.affected.startsWith('rwy') ? ', pista citada no aviso destacada em vermelho' : ''}.${geoLink}${cartaLink}</div>

    <div class="section-label">Em linguagem simples</div>
    <div class="plain-block">${n.full}</div>

    <div class="section-label">Texto original (NOTAM)</div>
    <div class="raw-box show" style="margin-bottom:16px;">${n.raw}</div>
  `;
}

function toggleRaw(i){
  document.getElementById(`raw-${i}`).classList.toggle('show');
  document.getElementById(`toggle-${i}`).classList.toggle('open');
}

// remove acentos para a busca não depender de o usuário digitar acentuação exata
const DIACRITICS_REGEX = new RegExp('[' + String.fromCharCode(0x0300) + '-' + String.fromCharCode(0x036f) + ']', 'g');
function normalizeSearch(s){
  return s.normalize('NFD').replace(DIACRITICS_REGEX, '').toLowerCase().trim();
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = normalizeSearch(e.target.value);
  if(!q) return;
  const match = AIRPORTS.find(a => normalizeSearch(a.code).includes(q) || normalizeSearch(a.city).includes(q));
  // ao achar pela busca, volta pra aba NOTAM — senão o usuário troca de aeroporto mas
  // continua vendo a aba (ex.: ROTAER) em que já estava, e parece que "não tem NOTAM"
  if(match){ currentCode = match.code; currentTab = 'notam'; currentView='list'; render(); }
});

/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA — em segundo plano, mesmo intervalo
   com que a REDEMET renova satélite/METAR na prática
   ========================================================= */
const AUTO_REFRESH_MS = 10 * 60 * 1000; // 10 minutos

function refreshAllRealData(){
  // com dezenas de aeroportos cadastrados, só vale a pena manter fresco
  // o que está sendo exibido agora — evita bater na API à toa pros outros
  REAL_METAR[currentCode] = undefined;
  loadRealMetar(currentCode);
  REAL_SATELITE = undefined;
  loadRealSatelite();
}

setInterval(refreshAllRealData, AUTO_REFRESH_MS);

render();
</script>
</body>
</html>
