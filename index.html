<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviso Aéreo</title>
<style>
  :root{
    --bg: #0B1220;
    --panel: #131C2E;
    --panel-2: #1B2740;
    --amber: #F2A93B;
    --amber-dim: #7A5A25;
    --text: #E8ECF4;
    --muted: #7C8AA5;
    --green: #4ADE80;
    --red: #F2665A;
    --blue: #5FA8E8;
    --line: #263352;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Public Sans', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
  }
  .mono{ font-family: 'JetBrains Mono', 'Courier New', monospace; }

  /* header */
  .app-header{
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0E1626 0%, #0B1220 100%);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:34px; height:34px;
    border-radius: 8px;
    background: var(--amber);
    display:flex; align-items:center; justify-content:center;
    color:#151515; font-weight:800; font-size:15px;
    font-family: 'JetBrains Mono', monospace;
    flex-shrink:0;
  }
  .brand-text{ line-height:1.1; }
  .brand-text .name{ font-weight:700; font-size:17px; letter-spacing:0.2px;}
  .brand-text .tag{ font-size:11.5px; color:var(--muted); letter-spacing:0.4px; text-transform:uppercase; margin-top:2px;}

  .search-wrap{
    margin-top:22px;
    position:relative;
  }
  .search-input{
    width:100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px 14px 44px;
    color: var(--text);
    font-size: 15px;
    outline:none;
  }
  .search-input:focus{ border-color: var(--amber); }
  .search-input::placeholder{ color: var(--muted); }
  .search-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color: var(--muted); font-size:16px; pointer-events:none;
  }

  .suggestions{
    display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;
  }
  .chip{
    background: var(--panel-2);
    border:1px solid var(--line);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    cursor:pointer;
    transition: all .15s ease;
    font-family: 'JetBrains Mono', monospace;
  }
  .chip:hover, .chip.active{
    border-color: var(--amber);
    color: var(--amber);
  }

  /* main */
  main{ padding: 22px 20px 80px; max-width: 640px; margin: 0 auto; }

  .airport-banner{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:16px;
    padding-bottom:16px;
    border-bottom: 1px dashed var(--line);
  }
  .airport-banner .code{
    font-family:'JetBrains Mono', monospace;
    color: var(--amber);
    font-size: 13px;
    letter-spacing: 1px;
  }
  .airport-banner .city{
    font-size: 22px;
    font-weight: 700;
    margin-top:4px;
  }
  .airport-banner .updated{
    text-align:right;
    font-size:11.5px;
    color: var(--muted);
  }
  .airport-banner .updated b{
    display:block;
    color: var(--green);
    font-size: 12.5px;
    font-weight:600;
  }

  /* tabs (NOTAM / METAR / ROTAER) */
  .tabs{
    display:flex;
    gap:6px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding: 9px 8px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 650;
    color: var(--muted);
    cursor:pointer;
    transition: all .15s ease;
    user-select:none;
    letter-spacing:0.3px;
  }
  .tab:hover{ color: var(--text); }
  .tab.active{
    background: var(--amber);
    color: #151515;
  }

  .section-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin: 22px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }
  .section-label:first-child{ margin-top:0; }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 16px 14px;
    margin-bottom: 12px;
    position: relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0;
    width:4px;
  }
  .card.high::before{ background: var(--red); }
  .card.med::before{ background: var(--amber); }
  .card.low::before{ background: var(--green); }
  .card.info::before{ background: var(--blue); }

  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 10px;
  }
  .card-title{
    font-size: 15px;
    font-weight: 650;
    line-height:1.35;
  }
  .badge{
    flex-shrink:0;
    font-size: 10px;
    font-weight:700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    white-space:nowrap;
  }
  .badge.high{ background: rgba(242,102,90,0.15); color: var(--red); }
  .badge.med{ background: rgba(242,169,59,0.15); color: var(--amber); }
  .badge.low{ background: rgba(74,222,128,0.15); color: var(--green); }
  .badge.info{ background: rgba(95,168,232,0.15); color: var(--blue); }

  .card-meta{
    display:flex; gap:14px; margin-top:8px;
    font-size:12px; color: var(--muted);
  }

  .link-row{
    display:flex; gap:16px;
    margin-top:12px;
  }
  .toggle-raw, .link-detail{
    font-size: 12px;
    color: var(--amber);
    cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
    user-select:none;
  }
  .toggle-raw::before{ content:"▸"; font-size:10px; transition: transform .15s; }
  .toggle-raw.open::before{ transform: rotate(90deg); }
  .link-detail{ color: var(--blue); }
  .link-detail::after{ content:"→"; font-size:12px; }

  .raw-box{
    display:none;
    margin-top: 10px;
    background: #0B111E;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    line-height:1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .raw-box.show{ display:block; }

  /* METAR grid */
  .metar-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .metar-stat{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
  }
  .metar-stat .label{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .metar-stat .value{
    font-size: 19px;
    font-weight: 700;
  }
  .metar-stat .value span{
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  /* ROTAER info list */
  .rotaer-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .rotaer-row{
    display:flex; justify-content:space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .rotaer-row:last-child{ border-bottom:none; }
  .rotaer-row .k{ color: var(--muted); }
  .rotaer-row .v{ font-weight: 600; text-align:right; }

  .empty{
    text-align:center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .icon{ font-size: 32px; margin-bottom: 10px; }

  .footnote{
    text-align:center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 30px;
    line-height:1.6;
  }

  /* ---- detail (sub-page / camada 2) ---- */
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; color: var(--muted);
    cursor:pointer; margin-bottom:16px;
    user-select:none;
  }
  .back-btn:hover{ color: var(--text); }
  .back-btn::before{ content:"←"; }

  .detail-header{
    margin-bottom:18px;
  }
  .detail-header .d-title{
    font-size:19px; font-weight:700; line-height:1.35;
  }
  .detail-header .d-meta{
    margin-top:6px; font-size:12px; color:var(--muted);
    display:flex; gap:12px;
  }

  .image-frame{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 8px;
    overflow:hidden;
  }
  .image-frame svg{ width:100%; height:auto; display:block; border-radius:8px; }
  .image-caption{
    font-size: 11px;
    color: var(--muted);
    text-align:center;
    margin-bottom:18px;
    line-height:1.5;
  }
  .image-caption b{ color: var(--amber); font-weight:600; }

  .plain-block{
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 18px;
  }

  .tech-table{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
    margin-bottom: 16px;
  }
  .tech-row{
    display:flex;
    border-bottom: 1px solid var(--line);
  }
  .tech-row:last-child{ border-bottom:none; }
  .tech-code{
    width: 92px; flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--amber);
    padding: 12px 10px;
    background: var(--panel-2);
    display:flex; align-items:center;
  }
  .tech-mean{
    padding: 12px 14px;
    font-size: 13px;
    flex:1;
  }
  .tech-mean .t{ font-weight:600; margin-bottom:2px; }
  .tech-mean .d{ color: var(--muted); font-size:12px; }

  .source-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size: 10.5px;
    letter-spacing:0.3px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .source-tag .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--muted);
    flex-shrink:0;
  }
  .source-tag.real .dot{ background: var(--green); }
  .source-tag.real{ color: var(--green); }
  .source-tag.fallback .dot{ background: var(--amber); }
  .source-tag.fallback{ color: var(--amber); }
</style>
</head>

/* =========================================================
   INTEGRAÇÃO REAL — API-REDEMET (METAR)
   ========================================================= */
function pad(n){ return n.toString().padStart(2,'0'); }

function nowUTCString(offsetHours){
  const d = new Date(Date.now() + (offsetHours||0)*3600*1000);
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}`;
}

function timeAgo(dateStr){
  if(!dateStr) return "agora mesmo";
  const then = new Date(dateStr.replace(' ', 'T') + 'Z').getTime();
  if(isNaN(then)) return "agora mesmo";
  const diffMin = Math.round((Date.now() - then)/60000);
  if(diffMin < 1) return "agora mesmo";
  if(diffMin < 60) return `há ${diffMin} min`;
  return `há ${Math.round(diffMin/60)}h`;
}

  let windText = '—', windSpeedText = '—', windKt = 0, gustKt = 0;
  let visibilityKm = 10, visibilityText = '10 km';
  let cloudsText = 'Céu limpo';
  let tempText = '—', dewText = '—', qnhText = '—';
  const wxPhrases = [];

  tokens.forEach(tok => {
    let m;
    if((m = tok.match(/^(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT$/))){
      windText = m[1] === 'VRB' ? 'Variável' : `${m[1]}°`;
      windKt = parseInt(m[2], 10);
      gustKt = m[4] ? parseInt(m[4], 10) : 0;
      windSpeedText = gustKt ? `${windKt} kt, rajadas ${gustKt} kt` : `${windKt} kt`;
    } else if(tok === 'CAVOK'){
      visibilityKm = 10; visibilityText = '10 km (CAVOK)'; cloudsText = 'Céu limpo';
    } else if(/^\d{4}$/.test(tok) && tok !== '0000'){
      const meters = parseInt(tok, 10);
      visibilityKm = meters/1000;
      visibilityText = meters >= 9999 ? '10 km' : `${(meters/1000).toFixed(1)} km`;
    } else if(['SKC','NSC','CLR'].includes(tok)){
      cloudsText = 'Céu limpo';
    } else if((m = tok.match(/^(FEW|SCT|BKN|OVC)(\d{3})$/))){
      const desc = `${CLOUD_NAMES[m[1]]} a ${parseInt(m[2],10)*100} ft`;
      cloudsText = cloudsText === 'Céu limpo' ? desc : `${cloudsText} / ${desc}`;
    } else if(WX_MAP[tok]){
      wxPhrases.push(WX_MAP[tok]);
    } else if((m = tok.match(/^(M?\d{2})\/(M?\d{2})$/))){
      tempText = (m[1].startsWith('M') ? '-'+m[1].slice(1) : m[1]) + '°C';
      dewText = (m[2].startsWith('M') ? '-'+m[2].slice(1) : m[2]) + '°C';
    } else if((m = tok.match(/^Q(\d{4})$/))){
      qnhText = `${parseInt(m[1],10)} hPa`;
    }
  });

  if(wxPhrases.length) cloudsText += ` — ${wxPhrases.join(', ')}`;

  let level = 'low', condition = 'Bom para voo';
  const hasLowVis = visibilityKm < 5 || wxPhrases.some(w => ['neblina','nevoeiro'].includes(w));
  const hasStrongWind = windKt >= 20 || gustKt >= 30;
  if(hasLowVis){ level = 'med'; condition = 'Baixa visibilidade — possíveis atrasos'; }
  else if(hasStrongWind){ level = 'med'; condition = 'Vento forte — possíveis atrasos'; }

  return {
    updated: timeAgo(recebimento),
    wind: windText,
    windSpeed: windSpeedText,
    visibility: visibilityText,
    clouds: cloudsText,
    temp: tempText,
    dew: dewText,
    qnh: qnhText,
    condition, level,
    raw: clean + '='
  };
}

async function loadRealMetar(icao){
  if(metarLoading[icao]) return;
  metarLoading[icao] = true;
  try{
    const dataFim = nowUTCString(0);
    const dataIni = nowUTCString(-6); // últimas 6h, pega a mensagem mais recente disponível
    const url = `${REDEMET_BASE}/mensagens/metar/${icao}?data_ini=${dataIni}&data_fim=${dataFim}`;
    const resp = await fetch(url, { headers: { 'X-Api-Key': REDEMET_API_KEY } });
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();
    const list = (json && json.data && json.data.data) || [];
    if(list.length === 0) throw new Error('sem mensagens no período consultado');
    const ultima = list[list.length - 1];
    REAL_METAR[icao] = parseMetarRaw(ultima.mens, ultima.recebimento);
  }catch(err){
    console.warn('Falha ao buscar METAR real da REDEMET para', icao, err);
    REAL_METAR[icao] = null; // marca como "tentou e falhou" -> cai no mock
  }finally{
    metarLoading[icao] = false;
    if(currentTab === 'metar' && currentCode === icao){
      render();
    }
  }
}

function getMetarData(icao){
  if(REAL_METAR[icao]) return { ...REAL_METAR[icao], source: 'real' };
  if(REAL_METAR[icao] === null) return MOCK_METAR[icao] ? { ...MOCK_METAR[icao], source: 'fallback' } : null;
  return MOCK_METAR[icao] ? { ...MOCK_METAR[icao], source: 'loading' } : null;
}

function sourceTagHtml(source){
  if(source === 'real') return `<div class="source-tag real"><span class="dot"></span>Dado real — API-REDEMET</div>`;
  if(source === 'loading') return `<div class="source-tag"><span class="dot"></span>Carregando dado real da REDEMET...</div>`;
  if(source === 'fallback') return `<div class="source-tag fallback"><span class="dot"></span>Dado de exemplo — REDEMET indisponível no momento</div>`;
  return '';
}

let currentCode = "SBFL";
let currentTab = "notam";
let currentView = "list";   // 'list' | 'notam-detail' | 'metar-detail'
let currentNotamIndex = 0;

function levelLabel(l){
  return l === "high" ? "Atenção" : l === "med" ? "Aviso" : l === "info" ? "Info" : "Informativo";
}

function renderChips(){
  const chips = document.getElementById('chips');
  chips.innerHTML = "";
  AIRPORTS.forEach(a => {
    const el = document.createElement('div');
    el.className = 'chip' + (a.code === currentCode ? ' active' : '');
    el.textContent = a.code;
    el.onclick = () => { currentCode = a.code; currentView = 'list'; render(); };
    chips.appendChild(el);
  });
}

/* ---------- SVGs de exemplo (placeholders ilustrativos) ---------- */

function svgRunwayChart(affected){
  const highlightMap = {
    rwy32: {x:60, y:40, w:60, h:14},
    rwy14: {x:60, y:126, w:60, h:14},
    rwy09r:{x:40, y:80, w:220, h:10},
    apron: {x:210, y:110, w:40, h:36},
    airspace:{x:0,y:0,w:0,h:0},
    nav: {x:250, y:70, w:16, h:16}
  };
  const hl = highlightMap[affected] || {x:0,y:0,w:0,h:0};
  const highlightRect = hl.w ? `<rect x="${hl.x}" y="${hl.y}" width="${hl.w}" height="${hl.h}" rx="4" fill="none" stroke="#F2665A" stroke-width="2.5" stroke-dasharray="4 3"/>` : '';
  return `
  <svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="180" fill="#0B111E"/>
    <rect x="20" y="60" width="280" height="20" rx="2" fill="#2B3A56"/>
    <rect x="20" y="118" width="280" height="20" rx="2" fill="#2B3A56"/>
    <rect x="200" y="80" width="90" height="60" rx="6" fill="#1B2740" stroke="#263352"/>
    <rect x="30" y="20" width="60" height="30" rx="4" fill="#1B2740" stroke="#263352"/>
    <text x="24" y="55" fill="#7C8AA5" font-size="9" font-family="monospace">14</text>
    <text x="290" y="55" fill="#7C8AA5" font-size="9" font-family="monospace">32</text>
    <text x="215" y="95" fill="#7C8AA5" font-size="9" font-family="monospace">PÁTIO</text>
    ${highlightRect}
  </svg>`;
}

function svgSatellite(level){
  const cloudColor = level === 'med' ? '#F2A93B' : '#5FA8E8';
  return `
  <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g1" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#152036"/>
        <stop offset="100%" stop-color="#0B111E"/>
      </radialGradient>
    </defs>
    <rect width="320" height="200" fill="url(#g1)"/>
    <circle cx="160" cy="100" r="70" fill="none" stroke="#263352" stroke-width="1"/>
    <circle cx="160" cy="100" r="45" fill="none" stroke="#263352" stroke-width="1"/>
    <circle cx="160" cy="100" r="3" fill="${cloudColor}"/>
    <ellipse cx="120" cy="70" rx="38" ry="16" fill="${cloudColor}" opacity="0.25"/>
    <ellipse cx="190" cy="110" rx="50" ry="20" fill="${cloudColor}" opacity="0.35"/>
    <ellipse cx="150" cy="130" rx="30" ry="12" fill="${cloudColor}" opacity="0.2"/>
    <text x="12" y="18" fill="#7C8AA5" font-size="9" font-family="monospace">SATÉLITE · CANAL IV</text>
  </svg>`;
}

/* ---------- render principal ---------- */

function render(){
  renderChips();
  const airport = AIRPORTS.find(a => a.code === currentCode);
  const main = document.getElementById('main');

  if(currentTab === 'metar' && REAL_METAR[currentCode] === undefined){
    loadRealMetar(currentCode);
  }

  if(currentView === 'notam-detail'){
    renderNotamDetail(main, airport);
    return;
  }
  if(currentView === 'metar-detail'){
    renderMetarDetail(main, airport);
    return;
  }

  // view padrão: lista
  let updated = "—";
  if(currentTab === "notam") updated = (MOCK_NOTAM[currentCode] || {}).updated || "—";
  if(currentTab === "metar") updated = (getMetarData(currentCode) || {}).updated || "—";
  if(currentTab === "rotaer") updated = "ficha estática";

  main.innerHTML = `
    <div class="airport-banner">
      <div>
        <div class="code">${airport.code} · ${airport.uf}</div>
        <div class="city">${airport.city}</div>
      </div>
      <div class="updated">Atualizado<b>${updated}</b></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="sections"></div>
  `;
  renderTabs();

  if(currentTab === "notam") renderNotamList(MOCK_NOTAM[currentCode]);
  if(currentTab === "metar") renderMetarSummary(getMetarData(currentCode));
  if(currentTab === "rotaer") renderRotaer(MOCK_ROTAER[currentCode]);
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = "";
  TABS.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === currentTab ? ' active' : '');
    el.textContent = t.label;
    el.onclick = () => { currentTab = t.id; render(); };
    tabs.appendChild(el);
  });
}

function renderNotamList(data){
  const sections = document.getElementById('sections');
  if(!data || data.notices.length === 0){
    sections.innerHTML = `<div class="empty"><div class="icon">✓</div>Nenhum aviso relevante no momento para este aeroporto.</div>`;
    return;
  }
  sections.innerHTML = `<div class="section-label">Avisos ativos · ${data.notices.length}</div>` +
    data.notices.map((n, i) => `
      <div class="card ${n.level}">
        <div class="card-top">
          <div class="card-title">${n.title}</div>
          <div class="badge ${n.level}">${levelLabel(n.level)}</div>
        </div>
        <div style="margin-top:8px; font-size:13.5px; color:var(--text); opacity:0.9; line-height:1.5;">
          ${n.plain}
        </div>
        <div class="card-meta">
          <span>${n.category}</span>
          <span>Válido: ${n.validity}</span>
        </div>
        <div class="link-row">
          <div class="toggle-raw" onclick="toggleRaw(${i})" id="toggle-${i}">Texto original</div>
          <div class="link-detail" onclick="openNotamDetail(${i})">Ver carta e detalhes</div>
        </div>
        <div class="raw-box" id="raw-${i}">${n.raw}</div>
      </div>
    `).join('');
}

function renderMetarSummary(data){
  const sections = document.getElementById('sections');
  if(!data){
    sections.innerHTML = `<div class="empty"><div class="icon">—</div>Sem dados meteorológicos no momento.</div>`;
    return;
  }
  sections.innerHTML = `
    <div class="section-label">Condições atuais · atualizado ${data.updated}</div>
    ${sourceTagHtml(data.source)}
    <div class="card ${data.level}" style="margin-bottom:14px;">
      <div class="card-top">
        <div class="card-title">${data.condition}</div>
        <div class="badge ${data.level}">${levelLabel(data.level)}</div>
      </div>
    </div>
    <div class="metar-grid">
      <div class="metar-stat"><div class="label">Vento</div><div class="value">${data.wind} <span>${data.windSpeed}</span></div></div>
      <div class="metar-stat"><div class="label">Visibilidade</div><div class="value">${data.visibility}</div></div>
      <div class="metar-stat"><div class="label">Nuvens</div><div class="value" style="font-size:14px;">${data.clouds}</div></div>
      <div class="metar-stat"><div class="label">Temperatura</div><div class="value">${data.temp} <span>orvalho ${data.dew}</span></div></div>
      <div class="metar-stat" style="grid-column: span 2;"><div class="label">Pressão (QNH)</div><div class="value">${data.qnh}</div></div>
    </div>
    <div class="link-row">
      <div class="toggle-raw" onclick="toggleRaw('metar')" id="toggle-metar">Texto original</div>
      <div class="link-detail" onclick="openMetarDetail()">Ver imagem e detalhes técnicos</div>
    </div>
    <div class="raw-box" id="raw-metar">${data.raw}</div>
  `;
}

function renderRotaer(data){
  const sections = document.getElementById('sections');
  if(!data){
    sections.innerHTML = `<div class="empty"><div class="icon">—</div>Sem ficha ROTAER disponível.</div>`;
    return;
  }
  const rows = [
    ["Nome oficial", data.nome], ["Elevação", data.elevacao], ["Pista", data.pista],
    ["Horário de funcionamento", data.horario], ["Frequência Torre", data.freqTorre],
    ["Frequência Aproximação", data.freqAproximacao], ["Combustível disponível", data.combustivel],
  ];
  sections.innerHTML = `
    <div class="section-label">Ficha do aeródromo</div>
    <div class="rotaer-card">
      ${rows.map(([k,v]) => `<div class="rotaer-row"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
    </div>
  `;
}

/* ---------- sub-páginas de detalhe (camada 2) ---------- */

function openNotamDetail(i){
  currentNotamIndex = i;
  currentView = 'notam-detail';
  render();
}
function openMetarDetail(){
  currentView = 'metar-detail';
  render();
}
function backToList(){
  currentView = 'list';
  render();
}

function renderNotamDetail(main, airport){
  const n = MOCK_NOTAM[currentCode].notices[currentNotamIndex];
  main.innerHTML = `
    <div class="back-btn" onclick="backToList()">voltar</div>
    <div class="detail-header">
      <div class="d-title">${n.title}</div>
      <div class="d-meta">
        <span>${airport.code} · ${n.category}</span>
        <span>Válido: ${n.validity}</span>
      </div>
    </div>

    <div class="section-label">Carta do aeródromo</div>
    <div class="image-frame">${svgRunwayChart(n.affected)}</div>
    <div class="image-caption">Diagrama ilustrativo com a área destacada em vermelho. <b>Em produção, viria da carta oficial (serviço "cartas" da API-AISWEB).</b></div>

    <div class="section-label">Em linguagem simples</div>
    <div class="plain-block">${n.full}</div>

    <div class="section-label">Texto original (NOTAM)</div>
    <div class="raw-box show" style="margin-bottom:16px;">${n.raw}</div>
  `;
}

function renderMetarDetail(main, airport){
  const d = getMetarData(currentCode);
  const techRows = [
    { code: d.raw.split(' ')[2] || '', t: 'Data e hora', d: 'Dia e horário (UTC) da observação' },
    { code: d.wind + ' / ' + d.windSpeed, t: 'Vento', d: 'Direção de onde o vento sopra e sua intensidade' },
    { code: d.visibility, t: 'Visibilidade horizontal', d: 'Distância máxima enxergada na horizontal' },
    { code: d.clouds, t: 'Nebulosidade', d: 'Quantidade e altura da base das nuvens' },
    { code: d.temp + ' / ' + d.dew, t: 'Temperatura / ponto de orvalho', d: 'Quanto mais próximos, maior a chance de neblina' },
    { code: d.qnh, t: 'Pressão QNH', d: 'Usada pelos pilotos para calibrar o altímetro' },
  ];
  main.innerHTML = `
    <div class="back-btn" onclick="backToList()">voltar</div>
    <div class="detail-header">
      <div class="d-title">${airport.city} — imagem e leitura técnica</div>
      <div class="d-meta"><span>${airport.code}</span><span>Atualizado ${d.updated}</span></div>
    </div>
    ${sourceTagHtml(d.source)}

    <div class="section-label">Imagem de satélite</div>
    <div class="image-frame">${svgSatellite(d.level)}</div>
    <div class="image-caption">Ilustração de exemplo (a imagem de satélite real ainda depende de outro endpoint da API-REDEMET).</div>

    <div class="section-label">Em linguagem simples</div>
    <div class="plain-block">${d.condition}. Vento de ${d.wind} a ${d.windSpeed}, visibilidade de ${d.visibility} e ${d.clouds.toLowerCase()}. Temperatura de ${d.temp}, com pressão de ${d.qnh}.</div>

    <div class="section-label">Leitura campo a campo</div>
    <div class="tech-table">
      ${techRows.map(r => `
        <div class="tech-row">
          <div class="tech-code">${r.code}</div>
          <div class="tech-mean"><div class="t">${r.t}</div><div class="d">${r.d}</div></div>
        </div>
      `).join('')}
    </div>

    <div class="section-label">Texto original (METAR)</div>
    <div class="raw-box show" style="margin-bottom:16px;">${d.raw}</div>
  `;
}

function toggleRaw(i){
  document.getElementById(`raw-${i}`).classList.toggle('show');
  document.getElementById(`toggle-${i}`).classList.toggle('open');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if(!q) return;
  const match = AIRPORTS.find(a => a.code.toLowerCase().includes(q) || a.city.toLowerCase().includes(q));
  if(match){ currentCode = match.code; currentView='list'; render(); }
});

render();
</script>
